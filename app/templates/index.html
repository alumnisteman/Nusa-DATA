<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NUSA OSS Copilot v2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dark-theme">
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">
                <div class="logo-icon">N</div>
                <span>NUSA OSS Copilot</span>
            </div>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <header class="hero glass-panel">
            <h1>Business Licensing MVP</h1>
            <p class="subtitle">Cek kandidat KBLI dan kesiapan awal usaha sebelum proses OSS.</p>
            
            <div class="tabs">
                <button class="tab-btn active" data-target="analysis-tab">Analisis Baru</button>
                <button class="tab-btn" data-target="dashboard-tab" id="load-dashboard">Dashboard & Riwayat</button>
            </div>
        </header>

        <main>
            <section id="analysis-tab" class="tab-content active">
                <div class="grid-layout">
                    <div class="form-container glass-panel">
                        <h2>Detail Usaha</h2>
                        <form id="analysis-form">
                            <div class="input-group">
                                <label for="business_name">Nama Usaha</label>
                                <input type="text" id="business_name" name="business_name" value="Cafe Kasturian" required placeholder="Contoh: Toko Maju Jaya">
                            </div>
                            
                            <div class="input-group">
                                <label for="description">Deskripsi Kegiatan Usaha</label>
                                <textarea id="description" name="description" required rows="4" placeholder="Jelaskan secara detail aktivitas bisnis Anda...">Menjual kopi, minuman, makanan ringan dan makanan berat di kafe.</textarea>
                            </div>

                            <div class="form-grid">
                                <div class="input-group">
                                    <label for="village">Kelurahan/Desa</label>
                                    <input type="text" id="village" name="village" value="Kasturian">
                                </div>
                                <div class="input-group">
                                    <label for="district">Kecamatan</label>
                                    <input type="text" id="district" name="district">
                                </div>
                                <div class="input-group">
                                    <label for="city">Kota</label>
                                    <input type="text" id="city" name="city" value="Ternate">
                                </div>
                                <div class="input-group">
                                    <label for="province">Provinsi</label>
                                    <input type="text" id="province" name="province" value="Maluku Utara">
                                </div>
                                <div class="input-group">
                                    <label for="latitude">Latitude</label>
                                    <input type="number" id="latitude" name="latitude" step="any">
                                </div>
                                <div class="input-group">
                                    <label for="longitude">Longitude</label>
                                    <input type="number" id="longitude" name="longitude" step="any">
                                </div>
                                <div class="input-group">
                                    <label for="investment_amount">Investasi (Rp)</label>
                                    <input type="number" id="investment_amount" name="investment_amount">
                                </div>
                            </div>
                            
                            <div class="input-group full-width">
                                <label for="address">Alamat Lengkap</label>
                                <input type="text" id="address" name="address">
                            </div>

                            <button type="submit" class="btn-primary" id="submit-btn">
                                <span>Analisis Sekarang</span>
                                <div class="spinner" style="display: none;"></div>
                            </button>
                        </form>
                    </div>

                    <div id="results-container" class="results-container">
                        <!-- Results will be injected here -->
                        <div class="empty-state glass-panel">
                            <div class="empty-icon">📊</div>
                            <h3>Belum ada data</h3>
                            <p>Silakan isi form di samping untuk memulai analisis kesiapan OSS Anda.</p>
                        </div>
                    </div>
                </div>
            </section>

            <section id="dashboard-tab" class="tab-content">
                <div class="stats-grid" id="stats-container">
                    <!-- Stats will be injected here -->
                </div>
                
                <div class="glass-panel mt-4">
                    <h2>Riwayat Analisis</h2>
                    <div class="history-list" id="history-container">
                        <!-- History will be injected here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Template -->
    <div id="history-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
